name: Build STQ CPU Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install Ninja
        run: choco install ninja

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Ninja Multi-Config" `
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake `
            -DGGML_NATIVE=ON `
            -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-stq-cpu-windows
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
